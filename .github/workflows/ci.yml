# CI for quectel-usbnet. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@e5c6ec3251cf3a6eea100a1c21736f1818d5efc7 # v1.23.0
    permissions:
      contents: read
    with:
      shfmt-args: -i 4 -ci
      # Shell tests seen: tests/run.sh. Name the runner:
      # test-command: ./tests/run.sh
      egress-policy: block
